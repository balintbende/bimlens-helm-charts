apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.api.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.api.serviceName }}
    helm.sh/chart: {{ include "bimlens.chart" . }}
    app.kubernetes.io/instance: {{ .Values.api.serviceName }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  # Attach to the shared, platform-managed Gateway (TLS, if added, lives on the Gateway).
  parentRefs:
    - name: {{ .Values.api.gateway.name }}
      namespace: {{ .Values.api.gateway.namespace }}
  {{- with .Values.api.host }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  # Generic catch-all: route every path for this host to the api Service,
  # exactly like the previous Ingress (path: / , Prefix).
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.api.serviceName }}
          # Must match the Service's port (service.yaml uses .Values.api.port).
          port: {{ .Values.api.port }}
